{% set name = "cbcbox" %}
{% set version = "2.937" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/34/19/d866081b826f223ba3d531eef8f9e0868b6d767a961c095ba1ab7ee9e90b/cbcbox-2.937-py3-none-manylinux2014_x86_64.whl
  sha256: f78cba63a977c40b696c235e32468837207605fbae05e43b21ddaacd98910096

build:
  number: 0
  #skip: true  # [not win]
  script: "{{ PYTHON }} -m pip install {{ name }}-{{ version }}-py3-none-manylinux2014_x86_64.whl -vv --no-deps --no-build-isolation"
  ignore_run_exports:
    - python
  #missing_dso_whitelist:
  #  - "*/lib*.dll"
  #  - "*/zlib1.dll"

requirements:
  host:
    - python
    - pip
    - zlib >=1.2.13,<2.0.0a0
  run:
    - python
    - pip
    - zlib >=1.2.13,<2.0.0a0

test:
  imports:
    - cbcbox
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/h-g-s/cbcbox
  summary: Binary distribution of the CBC MILP solver (COIN-OR Branch and Cut)
  description: High-performance, self-contained Python distribution of the CBC MILP solver (COIN-OR Branch and Cut), built from the latest COIN-OR master branch.
  #license_family: EPL
  #license: EPL 2.0
  dev_url: https://github.com/h-g-s/cbcbox
  doc_url: https://github.com/h-g-s/cbcbox/tree/master/docs

extra:
  skip-lints:
    - host_section_needs_exact_pinnings
    - avoid_noarch
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/110080
    reason: Dependency for mip
  recipe-maintainers:
    - ianaobi
